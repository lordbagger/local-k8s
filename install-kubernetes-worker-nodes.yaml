---
- name: Install Kubernetes on worker nodes (Debian based)
  hosts: nodes
  vars:
    kubernetes_version: v1.35
    crio_version: v1.35
  become: true

  tasks:
    - name: Ensure curl and gpg are installed
      ansible.builtin.package:
        name:
          - curl
          - gpg
        state: latest
        update_cache: false

    - name: Add repository for CRI-O (container runtime)
      block:
        - name: Remove cri-o-apt-keyring.gpg key if exists
          ansible.builtin.file:
            path: /etc/apt/keyrings/cri-o-apt-keyring.gpg
            state: absent

        - name: "Remove /etc/apt/keyrings/crio/Release.key if exists"
          ansible.builtin.file:
            path: /etc/apt/keyrings/crio/Release.key
            state: absent

        - name: "Ensure /etc/apt/keyrings/crio/ directory exists"
          ansible.builtin.file:
            path: /etc/apt/keyrings/crio/
            state: directory

        - name: Download key for CRI-O apt repository
          ansible.builtin.get_url:
            url: https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/Release.key
            dest: /etc/apt/keyrings/crio/Release.key

        - name: Convert Release.key into .gpg format
          ansible.builtin.shell: cat /etc/apt/keyrings/crio/Release.key | gpg --dearmor -o /etc/apt/keyrings/cri-o-apt-keyring.gpg

        - name: Add specified repository into sources list using specified filename
          ansible.builtin.apt_repository:
            repo: deb [signed-by=/etc/apt/keyrings/cri-o-apt-keyring.gpg] https://download.opensuse.org/repositories/isv:/cri-o:/stable:/{{ crio_version }}/deb/ /
            state: present
            filename: cri-o

    - name: Add repository for Kubernetes
      block:
        - name: Remove kubernetes-apt-keyring.gpg key if exists
          ansible.builtin.file:
            path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
            state: absent

        - name: "Remove /etc/apt/keyrings/kubernetes/Release.key if exists"
          ansible.builtin.file:
            path: /etc/apt/keyrings/kubernetes/Release.key
            state: absent

        - name: "Ensure /etc/apt/keyrings/kubernetes/ directory exists"
          ansible.builtin.file:
            path: /etc/apt/keyrings/kubernetes/
            state: directory

        - name: Download key for Kubernetes apt repository
          ansible.builtin.get_url:
            url: https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/Release.key
            dest: /etc/apt/keyrings/kubernetes/Release.key

        - name: Convert Release.key into .gpg format
          ansible.builtin.shell: cat /etc/apt/keyrings/kubernetes/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg

        - name: Add specified repository into sources list using specified filename
          ansible.builtin.apt_repository:
            repo: deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/{{ kubernetes_version }}/deb/ /
            state: present
            filename: kubernetes

    - name: Install CRI-O, kubeadm, kubelet and kubectl
      ansible.builtin.package:
        name:
          - cri-o
          - kubeadm
          - kubelet
          - kubectl
        state: latest

    - name: Disable swap
      ansible.builtin.shell: swapoff -a

    - name: Disable swap on startup
      ansible.builtin.shell: sed -i '/swap/s/^\(.*\)$/#\1/g' /etc/fstab

    - name: Ensuring structure required for Cilium (CNI plugin) exists
      block:
        - name: Ensure /run/systemd/resolve/ directory exists
          ansible.builtin.file:
            path: /run/systemd/resolve/
            state: directory

        - name: Ensure /run/systemd/resolve/resolv.conf exists
          ansible.builtin.file:
            path: /run/systemd/resolve/resolv.conf
            state: touch

    - name: Enable IPv4 packet forwarding via file
      ansible.builtin.template:
        src: k8s.conf.j2
        dest: /etc/sysctl.d/k8s.conf
        owner: root
        group: root
        mode: "0644"

    # This tasks is here only to reload sysctl without reboot
    - name: Enable IPv4 packet forwarding via sysctl command
      ansible.posix.sysctl:
        name: net.ipv4.ip_forward
        value: "1"
        sysctl_set: true
        state: present
        reload: true

    - name: Enable CRI-O
      ansible.builtin.service:
        name: crio
        state: reloaded
        enabled: true

    - name: Enable kubelet
      ansible.builtin.service:
        name: kubelet
        state: reloaded
        enabled: true
